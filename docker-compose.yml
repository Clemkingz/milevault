services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: milevault
      POSTGRES_PASSWORD: milevault
      POSTGRES_DB: milevault
    ports:
      - "5432:5432"
    volumes:
      - milevault-db:/var/lib/postgresql/data

volumes:
  milevault-db:
