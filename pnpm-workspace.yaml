packages:
  - "apps/*"
  - "packages/*"

# esbuild: needed by tsx / drizzle-kit. The rest: optional native add-ons from wallet-kit deps — not needed.
allowBuilds:
  esbuild: true
  "@reown/appkit": false
  bufferutil: false
  secp256k1: false
  utf-8-validate: false

# pnpm 9/10 equivalent of allowBuilds (used if a host runs an older pnpm)
onlyBuiltDependencies:
  - esbuild
